[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-memory"
version = "0.1.0"
description = "SLATE: exactly erasable parametric memory for personal agents (sharded, staged, deterministic adapters with erasure receipts)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
paper = ["numpy>=1.24", "matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
slate-demo = "slate.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# The article's generator and figure scripts are dense numerical code: compound statements are allowed there,
# and pyflakes still applies.
"paper/*" = ["E401", "E701", "E702", "E731", "E741"]
